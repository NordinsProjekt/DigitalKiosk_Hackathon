# This workflow will build a .NET project and run all unit tests.
# It is required to pass before any pull request can be merged into master.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build all projects
      run: dotnet build --no-restore --configuration Release
    - name: Run all unit tests
      run: dotnet test --no-build --no-restore --configuration Release --verbosity normal
