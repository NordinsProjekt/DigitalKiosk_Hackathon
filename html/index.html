<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Kiosk - Welcome</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>Digital Kiosk</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Home</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <div class="keyboard-container">
                <div class="keyboard-row-1234">
                    <button data-char="1" class="key">1</button>
                    <button data-char="2" class="key">2</button>
                    <button data-char="3" class="key">3</button>
                    <button data-char="4" class="key">4</button>
                    <button data-char="5" class="key">5</button>
                    <button data-char="6" class="key">6</button>
                    <button data-char="7" class="key">7</button>
                    <button data-char="8" class="key">8</button>
                    <button data-char="9" class="key">9</button>
                    <button data-char="0" class="key">0</button>
                    <button data-char="Backspace" class="key">⌫</button>

                </div>
                <div class="keyboard-row-qwerty">
                    <button data-char="Q" class="key">Q</button>
                    <button data-char="W" class="key">W</button>
                    <button data-char="E" class="key">E</button>
                    <button data-char="R" class="key">R</button>
                    <button data-char="T" class="key">T</button>
                    <button data-char="Y" class="key">Y</button>
                    <button data-char="U" class="key">U</button>
                    <button data-char="I" class="key">I</button>
                    <button data-char="O" class="key">O</button>
                    <button data-char="P" class="key">P</button>
                    <button data-char="Å" class="key">Å</button>

                </div>
                <div class="keyboard-row-asdfg">
                    <button data-char="A" class="key">A</button>
                    <button data-char="S" class="key">S</button>
                    <button data-char="D" class="key">D</button>
                    <button data-char="F" class="key">F</button>
                    <button data-char="G" class="key">G</button>
                    <button data-char="H" class="key">H</button>
                    <button data-char="J" class="key">J</button>
                    <button data-char="K" class="key">K</button>
                    <button data-char="L" class="key">L</button>
                    <button data-char="Ö" class="key">Ö</button>
                    <button data-char="Ä" class="key">Ä</button>

                </div>
                <div class="keyboard-row">
                    <button data-char="Z" class="key">Z</button>
                    <button data-char="X" class="key">X</button>
                    <button data-char="C" class="key">C</button>
                    <button data-char="V" class="key">V</button>
                    <button data-char="B" class="key">B</button>
                    <button data-char="N" class="key">N</button>
                    <button data-char="M" class="key">M</button>
                </div>
                <div class="keyboard-row">
                    <button data-char=" " class="key">Space</button>
                </div>

            </div>
            <input type="text" class="search-bar" placeholder="Search Field">
            <h2>Welcome to Digital Kiosk</h2>
        </div>
    </header>

    <main class="container" style="padding: 2rem 20px">
        <canvas id="store-map" width="1000" height="800"></canvas>
        <div id="error-message"></div>
        <div id="products-list"></div>
    </main>


    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Digital Kiosk. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/store-map.js"></script>
  </body>
</html>
